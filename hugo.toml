baseURL = 'https://craftedsignal.io/'
locale = 'en'
title = 'CraftedSignal'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# Enable i18n - set to false so | default fallbacks work
enableMissingTranslationPlaceholders = false

[params]
  description = "Runtime detection risk and backlog platform"
  tagline = "Turn threats, findings, telemetry gaps and noisy rules into risk-scored detection work across your security stack."
  email = "hello@craftedsignal.io"
  salesEmail = "hello@craftedsignal.io"
  docsURL = "/docs/"
  githubURL = "https://github.com/craftedsignal"

[languages]
  [languages.en]
    label = "English"
    weight = 1
    [languages.en.params]
      subtitle = "Runtime detection risk and backlog platform"

  # Ready for future languages
  # [languages.de]
  #   label = "Deutsch"
  #   weight = 2
  #   [languages.de.params]
  #     subtitle = "Detection Engineering Kontrollzentrum"

  # [languages.nl]
  #   label = "Nederlands"
  #   weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[build]
  [build.buildStats]
    enable = true

[minify]
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changeFreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.x]
    disable = true
  [privacy.vimeo]
    disable = true

  [privacy.youtube]
    disable = true

[security]
  [security.node]
    [security.node.permissions]
      disable = true
